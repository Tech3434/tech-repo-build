## Settings file was created by plugin TeZuBots v0.5.0
## Plugin GUID: TeZuBots.TeamBots

[Bots]

## Hit points of a bot.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 1 to 1000
Bot Health = 40

## Bot move speed relative to a player.
# Setting type: Single
# Default value: 0.85
# Acceptable value range: From 0,1 to 2
Speed Multiplier = 0.85

## Bots do not enter rooms that no player has visited yet.
# Setting type: Boolean
# Default value: true
Respect Unexplored Rooms = true

## Allow bots to pick up and fire guns (M3; melee fallback is always available).
# Setting type: Boolean
# Default value: false
Can Use Weapons = false

## Bots fight nearby monsters in melee instead of only running away.
# Setting type: Boolean
# Default value: true
Fight Back = true

## Player bullets, explosions and thrown objects damage bots (full friendly fire).
# Setting type: Boolean
# Default value: true
Friendly Fire = true

## Stage-1 aggression bridge: a monster close to a bot with line of sight damages it.
# Setting type: Boolean
# Default value: true
Monsters Hurt Bots = true

## How close a monster must be to hit a bot.
# Setting type: Single
# Default value: 6.5
# Acceptable value range: From 1 to 20
Monster Reach = 6.5

## Damage a monster deals to a bot per hit.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 1 to 100
Monster Hit Damage = 20

## Seconds between monster hits on the same bot.
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 0,2 to 10
Monster Hit Interval = 1.3

Monster Proximity Damage = false

Monster Contact Reach = 2.4

[Content]

## Register the dead head item and the two upgrades with REPOLib.
# Setting type: Boolean
# Default value: true
Register Content = true

## Item/UI language (English is primary, Russian secondary).
# Setting type: String
# Default value: en
# Acceptable values: en, ru
Language = en

## Shop price of one dead head at 1 player (the stand scales it with player count).
# Setting type: Int32
# Default value: 2500
# Acceptable value range: From 0 to 100000
Dead Head Price = 300

## Shop price of the Command Uplink at 1 player.
# Setting type: Int32
# Default value: 4000
# Acceptable value range: From 0 to 100000
Command Uplink Price = 300

## Shop price of Overwatch at 1 player.
# Setting type: Int32
# Default value: 3500
# Acceptable value range: From 0 to 100000
Overwatch Price = 300

## How many Command Uplink items can be bought per run.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 5
Command Uplink Max Level = 2

## How many Overwatch items can be bought per run.
# Setting type: Int32
# Default value: 2
# Acceptable value range: From 1 to 5
Overwatch Max Level = 2

[Diagnostics]

## F5 diagnostics, F6 spawn bot, F7 clear bots, F9 spawn dead head at player. Host only.
# Setting type: Boolean
# Default value: true
Debug Keys = true

## Write a diagnostics report to the log and to the report file when a run starts.
# Setting type: Boolean
# Default value: true
Run On Run Start = true

## Write TeZuBots-diagnostics.txt next to the BepInEx folder.
# Setting type: Boolean
# Default value: true
Write Report File = true

[General]

## Master switch for the mod.
# Setting type: Boolean
# Default value: true
Enabled = true

## Draw the TeZuBots debug overlay (toggle with F8).
# Setting type: Boolean
# Default value: true
Debug Overlay = true

## Log AI/order/network details. Spams the log; use only while debugging.
# Setting type: Boolean
# Default value: false
Verbose Logging = true

[RTS]

## How long Q must be held to enter commander mode.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0,5 to 5
Hold Q Seconds = 2

## Default top-down camera height.
# Setting type: Single
# Default value: 18
# Acceptable value range: From 5 to 60
Camera Height = 18

## Closest zoom height.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 2 to 60
Zoom Min = 8

## Farthest zoom height.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 5 to 120
Zoom Max = 40

## Leave commander mode when the body takes damage.
# Setting type: Boolean
# Default value: true
Exit On Damage = true

## Hide rooms that no player has visited.
# Setting type: Boolean
# Default value: true
Fog Of War = true

## Development-only switch: let everyone issue orders without the Command Uplink upgrade.
# Setting type: Boolean
# Default value: false
Allow Commands Without Upgrade = false

[Team]

## Bot slots every team starts with.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 8
Base Bot Slots = 0

## Hard cap for purchased bot slots.
# Setting type: Int32
# Default value: 4
# Acceptable value range: From 1 to 8
Max Bot Slots = 4

## Spawn a bot as soon as a free slot exists.
# Setting type: Boolean
# Default value: true
Auto Spawn Bots = true

