## Settings file was created by plugin RepoBots v0.22.5
## Plugin GUID: dcz.repo.playerbots

[Bots]

## How many bots join the host on every level (host only).
# Setting type: Int32
# Default value: 2
Count = 2

## If true, the level fails the moment every real player is dead, even with bots alive. If false, the bots get a chance to carry your heads to the truck and revive you.
# Setting type: Boolean
# Default value: false
FailWhenPeopleDie = false

## With every real player dead, the level fails if the bots haven't revived anyone after this many seconds.
# Setting type: Single
# Default value: 120
ReviveGiveUpSeconds = 120

## Bots carry valuables they've seen to the active extraction point, and turn on the next extraction point.
# Setting type: Boolean
# Default value: true
BotsHaul = true

## Bots drop what they're carrying and run when a monster gets close or hurts them.
# Setting type: Boolean
# Default value: true
BotsFlee = true

## Bots move with a real physics body built like a player's (momentum, gravity, falling, stamina, jumping, getting pushed). Off = the older smooth walking that ignores physics.
# Setting type: Boolean
# Default value: true
RealPhysics = true

## Bots throw themselves into a roll to escape a monster that's right on them (leaves them helpless for a moment).
# Setting type: Boolean
# Default value: false
BotsDive = false

## Singleplayer starts a private offline game (no internet needed, nobody can join) so bots can play with you; pick how many on the lobby screen. Turn off for the game's normal singleplayer.
# Setting type: Boolean
# Default value: true
SingleplayerBots = true

## In the shop, bots put things the team needs in the buy zone (health packs, crystals, upgrades), staying within their share of the money. People still press the buy button.
# Setting type: Boolean
# Default value: true
BotsShop = true

## Bots open chests, cabinets, wardrobes, fridges, lockers and safes to look for loot inside.
# Setting type: Boolean
# Default value: true
BotsOpen = true

## Bots split up and search rooms nobody has checked yet (finding loot as they go) instead of following you around.
# Setting type: Boolean
# Default value: true
BotsExplore = true

## Each round, the chance a bot really wants the cart: it takes charge of it straight away (if nobody's using it), brings it to the loot, fills it and takes it to extraction. Without a fan, a bot still takes over a cart nobody has touched for a while.
# Setting type: Single
# Default value: 0.5
CartFanChance = 0.5

## Bots load valuables into a nearby cart and push loaded carts to extraction.
# Setting type: Boolean
# Default value: true
BotsUseCarts = true

## Bots move like a player on keyboard and mouse: eight key directions at full speed (tapping to go slow), steering by turning the camera, mouse-like flicks when they look around. Off = smooth analog movement.
# Setting type: Boolean
# Default value: true
KeyboardMouse = true

## Each bot gets its own personality (brave/jumpy, greedy, helpful, chatty, clingy/lone wolf, careful/clumsy) that changes how it plays and talks. Kept per save in BepInEx/config/RepoBots/personas.
# Setting type: Boolean
# Default value: true
Personalities = true

## Bots lower loot to the floor before letting go (instead of dropping it), carry fragile things slower and brake before they bump into walls.
# Setting type: Boolean
# Default value: true
GentleCarry = true

## Bots only pick up valuables up to this heavy (physics mass). Big stuff is left for you.
# Setting type: Single
# Default value: 5
MaxCarryMass = 5

