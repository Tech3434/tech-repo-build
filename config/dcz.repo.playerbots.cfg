[Debug]

## Write a line to the log every few seconds while a bot carries loot (helps track down carrying problems).
# Setting type: Boolean
# Default value: true
CarryLog = true

[Talking]

## Bots talk out loud (the game's text-to-speech voice): calling out monsters, asking for help, saying where their head is when they die, answering you.
# Setting type: Boolean
# Default value: true
BotsTalk = true

## Bots listen to chat. Say a bot's name (or 'everyone') plus a command or question, e.g. 'bolt follow me', 'everyone to the truck', 'rusty where's the cart', 'grab that'. Unnamed commands go to the nearest bot that can hear you.
# Setting type: Boolean
# Default value: true
ChatCommands = true

## Talk to the bots with your mic instead of typing: anything you could type in chat works said out loud ('bolt follow me', 'everyone to the truck'). Uses Windows speech recognition, which needs 'Online speech recognition' turned on in Windows Settings > Privacy & security > Speech. Only listens while bots are around and your in-game mic is open (push to talk and mute count). Each player sets this for themselves.
# Setting type: Boolean
# Default value: true
VoiceCommands = true

## Bots type like players: gonna, u, ngl, fr, bro, the odd typo fixed with *word. Each bot has its own amount of slang and favourite words (new ones for each save). Off = plainer talk.
# Setting type: Boolean
# Default value: true
BotSlang = true

## Show what the speech recognition heard at the bottom of the screen for a few seconds.
# Setting type: Boolean
# Default value: true
VoiceShowText = true

## Which Claude model writes the replies.
# Setting type: String
# Default value: claude-haiku-5-5
ClaudeModel = claude-haiku-5-5

