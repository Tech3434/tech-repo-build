## Settings file was created by plugin ItemUnstuck v1.0.3
## Plugin GUID: Tolga.ItemUnstuck

[Debug]

## Enable verbose logging for stuck detection and relocation decisions. Set to true for maximum logging during testing.
# Setting type: Boolean
# Default value: false
VerboseLogging = false

[Detection]

## Enable detection and relocation of items that get stuck immediately after spawning mid-game (e.g. from vents/monsters).
# Setting type: Boolean
# Default value: true
EnableMidGameDetection = true

[Gameplay]

## If true, make valuables invulnerable until any player grabs them.
# Setting type: Boolean
# Default value: true
InvulnerableUntilGrab = true

## If true, restore damaged/relocated valuables back to their initial value.
# Setting type: Boolean
# Default value: true
RestoreValueToInitial = true

[General]

## Enable/disable the ItemUnstuck mod.
# Setting type: Boolean
# Default value: true
Enable = true

## If true, detects stuck valuables and relocates them to a free valuable spawn slot.
# Setting type: Boolean
# Default value: true
EnableRelocation = true

## Show a HUD notification when stuck valuables are relocated.
# Setting type: Boolean
# Default value: true
HudNotifications = true

## Show a HUD message displaying the item's initial (undamaged) value when you grab it.
# Setting type: Boolean
# Default value: false
ShowInitialValueOnGrab = false

