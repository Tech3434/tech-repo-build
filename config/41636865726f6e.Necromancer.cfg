## How far he can notice a player, metres (vanilla enemies: 10). Otherwise the game's rules: a cone that narrows as you crouch and crawl. He hears like any monster.
# Setting type: Single
# Default value: 14
VisionRange = 14

## The longest he hunts one player before he gives up, seconds.
# Setting type: Single
# Default value: 40
ChaseSeconds = 40

## Out of his sight this long and he glides to where he last saw you, seconds.
# Setting type: Single
# Default value: 5
LoseSeconds = 5

## How long he looks round where he lost you, seconds.
# Setting type: Single
# Default value: 6
SearchSeconds = 6

## While roaming, how often he drifts toward the nearest player's area (not to them), seconds.
# Setting type: Single
# Default value: 45
TipOffSeconds = 45

## The least time between one attack ending and the next starting, seconds. Every half second he can see you he picks one of the ready ones.
# Setting type: Single
# Default value: 1
AttackGap = 1

[Look]

## Brightness of his void glow, his eyes and the light they throw (0.5 dim, 2 bright).
# Setting type: Single
# Default value: 1
Glow = 1

## How much the room's lamps dim and flicker during his ritual (0 not at all, 1 the default: down to about a third).
# Setting type: Single
# Default value: 1
RitualDim = 1

[Movement]

## How fast he glides about while he hasn't found anyone, m/s (a player walks at about 3, sprints at about 4.8).
# Setting type: Single
# Default value: 0.9
RoamSpeed = 0.9

## How fast he glides toward someone he's hunting, m/s. He doesn't close in: he stops within casting range.
# Setting type: Single
# Default value: 2
ChaseSpeed = 2

## He likes to hunt from at least this far away, metres...
# Setting type: Single
# Default value: 4
CastMinRange = 4

## ...and no farther than this, metres; farther off he glides closer.
# Setting type: Single
# Default value: 10
CastMaxRange = 10

## How high his robe's hem floats over the floor, metres.
# Setting type: Single
# Default value: 0.08
Hover = 0.08

