Tier = 2

## His roll in each slot's lottery; every vanilla monster has 100. Lower is rarer (60 almost never wins), higher beats the vanilla ones more often. Only the host's counts. Restart to apply.
# Setting type: Single
# Default value: 100
Chance = 100

## Levels completed in the run before he can appear. 0 from the first. Restart to apply.
# Setting type: Int32
# Default value: 0
MinLevel = 0

## Runs the host must have played before he can appear. Restart to apply.
# Setting type: Int32
# Default value: 0
MinRuns = 0

## His health (the Robe has 200). He drops an orb when killed and comes back later in the level. Restart to apply.
# Setting type: Int32
# Default value: 200
Health = 200

[Sweep]

## He sweeps his staff at players this close, metres.
# Setting type: Single
# Default value: 2.2
Reach = 2.2

## Damage from the staff (players have 100).
# Setting type: Single
# Default value: 12
Damage = 12

## How long the sweep knocks you down, seconds. 0: no knockdown.
# Setting type: Single
# Default value: 1
TumbleSeconds = 1

## How hard it shoves you (and loot) away, roughly m/s.
# Setting type: Single
# Default value: 6
Shove = 6

## Damage to another monster caught by the staff. 0 leaves them alone.
# Setting type: Single
# Default value: 20
EnemyDamage = 20

## The least time between sweeps, seconds.
# Setting type: Single
# Default value: 3
Cooldown = 3

[Thrall]

## A thrall's health. Killed, it collapses into ash; no orb. Restart to apply.
# Setting type: Int32
# Default value: 60
Health = 60

## How fast a thrall shambles about, m/s.
# Setting type: Single
# Default value: 1
RoamSpeed = 1

## How fast a thrall lurches after someone, m/s. A walk (about 3) outpaces it.
# Setting type: Single
# Default value: 2.6
ChaseSpeed = 2.6

## Damage from a thrall's swipe (players have 100).
# Setting type: Single
# Default value: 10
Damage = 10

## How far a thrall's swipe reaches, metres.
# Setting type: Single
# Default value: 1.4
Reach = 1.4

## How long a thrall draws its arms back before it swipes, seconds.
# Setting type: Single
# Default value: 0.5
WindUpSeconds = 0.5

## The least time between a thrall's swipes, seconds.
# Setting type: Single
# Default value: 1.5
Cooldown = 1.5

## How far a thrall notices players, metres (it has no head; don't ask how).
# Setting type: Single
# Default value: 12
VisionRange = 12

## How hard a thrall's swipe knocks loot it catches, roughly m/s.
# Setting type: Single
# Default value: 2
LootShove = 2

## How strongly a thrall's body is tinged dark green and purple (0 the player's own colour, 1 all tinge).
# Setting type: Single
# Default value: 0.4
Tinge = 0.4

