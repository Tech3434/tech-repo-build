[Head]

## After a thrall rises, the dead player's own head floats up off the floor and onto its neck. Grab the head and pull it away to rip it off: the thrall falls, and you're holding the head to revive them. Off: thralls stay headless and the head stays on the floor.
# Setting type: Boolean
# Default value: true
Enabled = true

## How long after a thrall has risen its head starts to float up, seconds.
# Setting type: Single
# Default value: 0.6
DelaySeconds = 0.6

## How long the head takes to float up onto the neck, seconds.
# Setting type: Single
# Default value: 1.2
PullSeconds = 1.2

## The head only floats over from this close, metres. If someone is holding it when it's time, it waits until they let go, and gives up if it's farther than this by then.
# Setting type: Single
# Default value: 12
Reach = 12

## Hold on to the head this long and it rips off, seconds. Let go sooner and it snaps back on.
# Setting type: Single
# Default value: 0.6
RipSeconds = 0.6

## Pull the head this far from the neck and it rips off at once, metres.
# Setting type: Single
# Default value: 0.5
RipDistance = 0.5

## A head that's due to come up but can't (a wall in the way, the thrall wandered off) is brought straight to the neck after this long, seconds. Never out of a player's hands, an extraction point or the truck.
# Setting type: Single
# Default value: 5
StuckSeconds = 5

