# Default value: true
Enabled = true

## How far off he notices a dead player's head, metres, with nothing solid between.
# Setting type: Single
# Default value: 15
FindRange = 15

## After a thrall wearing (or reaching for) a head dies, crumbles or has it pulled off, or a player holds it, he leaves that head alone this long, seconds.
# Setting type: Single
# Default value: 60
FindCooldown = 60

## How far from him he casts it, metres (he looks for clear floor 0.5 m either side of this).
# Setting type: Single
# Default value: 2
Distance = 2

## When his drain, bolt or staff lands on a player carrying a dead player's head, it's knocked out of their hands, and he can go for it at once.
# Setting type: Boolean
# Default value: true
KnockHeadsLoose = true

