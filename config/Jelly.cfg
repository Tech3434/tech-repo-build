## Settings file was created by plugin JellyMod v1.0.0
## Plugin GUID: Jelly

[Audio]

## Loudness of all cube sounds: hop squish and escape pop (3 = default, 0 = silent). Also follows the game's own volume settings.
# Setting type: Single
# Default value: 3
Volume = 3

[Damage]

## Damage per second to a player inside Jelly (2 = default, 0 = harmless, max 100).
# Setting type: Int32
# Default value: 2
Jelly = 2

## Damage per second to a player inside Jammy (4 = default, 0 = harmless, max 100).
# Setting type: Int32
# Default value: 4
Jammy = 4

## Damage per second to a player inside a Mini-Jammy (2 = default, 0 = harmless, max 100).
# Setting type: Int32
# Default value: 2
MiniJammy = 2

[Gameplay]

## Seconds a cube squashes down as a warning before each pounce (0 = no warning, max 1). It aims when it actually leaps.
# Setting type: Single
# Default value: 0.4
PounceWindup = 0.4

## Cubes swallow dead players' heads (2 points of space; fits in a Mini-Jammy). A head inside a cube can't be revived at extraction until it's out.
# Setting type: Boolean
# Default value: true
AbsorbHeads = true

## When a cube dies in a pit, the items it held fall in and bounce there for this many seconds so players can grab them out, then the pit destroys them as usual (0 = destroyed at once, max 30). Dead players' heads always bounce.
# Setting type: Single
# Default value: 5
PitItemGraceSeconds = 5

[Inside cube]

## When to show "Mash [Jump] to escape!" while you're inside a cube. FirstTimePerCampaign = only your first time in each save file. Always = every time. Never = never.
# Setting type: HintMode
# Default value: FirstTimePerCampaign
# Acceptable values: FirstTimePerCampaign, Always, Never
EscapeHint = FirstTimePerCampaign

## How strongly your screen is tinted green while you're inside Jelly (0 = off, 1 = solid colour).
# Setting type: Single
# Default value: 0.2
TintJelly = 0.2

## How strongly your screen is tinted purple while you're inside Jammy or a Mini-Jammy (0 = off, 1 = solid colour).
# Setting type: Single
# Default value: 0.07
TintJammy = 0.07

## How muffled players inside a cube sound to you: a low-pass cutoff in Hz (lower = more muffled; the game's own behind-a-wall muffle is 1000; 0 = off).
# Setting type: Single
# Default value: 725
VoiceMuffle = 725

## How loud players inside a cube sound to you, compared to normal (0 to 1).
# Setting type: Single
# Default value: 0.8
VoiceVolume = 0.8

[Jammy]

## Jammy, the purple variant that splits into Mini-Jammys when it dies, can spawn in levels. Needs a game restart.
# Setting type: Boolean
# Default value: true
Enabled = true

## How many Mini-Jammys a Jammy splits into when it dies (0 = none, max 6).
# Setting type: Int32
# Default value: 2
SplitCount = 2

[Look]

## How cloudy the cubes look from outside (0 = glass-clear, 0.2 = default, 0.5 = quite cloudy, 1 = solid).
# Setting type: Single
# Default value: 0.2
Haze = 0.2

[Patrol]

## How strongly cubes roam toward areas with lots of loose valuables (0 = random roaming, 1 = default, 2 = very strong).
# Setting type: Single
# Default value: 1
LootPull = 1

## Seconds a cube keeps patrolling a loot-heavy area before moving on.
# Setting type: Single
# Default value: 25
ZoneStay = 25

## Items a cube picks up from an area on its own before it backs off (minimum 1). Items players throw in and lit explosives don't count.
# Setting type: Int32
# Default value: 1
ItemsPerZone = 1

## After taking its share, a cube ignores loose loot and wanders off for this many seconds.
# Setting type: Single
# Default value: 30
ItemCooldown = 30

[Speed]

## Jelly's move speed as a multiplier (0.85 = default, range 0.1 to 3). Covers roaming, investigating, chasing and oozing, not the pounce leap.
# Setting type: Single
# Default value: 0.85
Jelly = 0.85

## Jammy's move speed as a multiplier (0.85 = default, range 0.1 to 3).
# Setting type: Single
# Default value: 0.85
Jammy = 0.85

## A Mini-Jammy's move speed as a multiplier (0.85 = default, range 0.1 to 3).
# Setting type: Single
# Default value: 0.85
MiniJammy = 0.85

## How fast a Mini-Jammy runs after it leaps out of a cart, as a multiple of its chase speed (range 0.5 to 4).
# Setting type: Single
# Default value: 1.8
MiniCartEscape = 1.8

