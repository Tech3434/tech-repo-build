## Settings file was created by plugin Self Moving Cart v1.3.3
## Plugin GUID: Syntaxe.SelfMovingCart

[Controls]

## The key used to select whether your orders will be excuted by the nearest cart, or a particular cart.
# Setting type: String
# Default value: r
CartSwitchKey = z

## The key used to order the cart to come to the player.
# Setting type: String
# Default value: f
GoToPlayerKey = x

## The key used to order the cart to go to the ship.
# Setting type: String
# Default value: g
GoToShipKey = p

## The key used to order the cart to go to the extraction (Stands outside extraction).
# Setting type: String
# Default value: v
GoToExtractionKey = c

## The key used to order the cart to go to go inside extraction.
# Setting type: String
# Default value: b
ExtractKey = n

## If you hold this key, WASD keys will stop controlling the player movement and will control the cart instead (A more practical alternative to using the arrow keys).
# Setting type: String
# Default value: capsLock
CartRemoteControlModeKey = alt

## The key used to order the cart to go forward.
# Setting type: String
# Default value: upArrow
GoForwardKey = upArrow

## The key used to order the cart to go backwards.
# Setting type: String
# Default value: downArrow
GoBackwardsKey = downArrow

## The key used to order the cart to turn right
# Setting type: String
# Default value: rightArrow
TurnRightKey = rightArrow

## The key used to order the cart to turn left
# Setting type: String
# Default value: leftArrow
TurnLeftKey = leftArrow

[UI]

## Determines whether the cart mode ui will always be shown or if it will only be shown when the player switches the mode and then disappears again.
# Setting type: Boolean
# Default value: false
AlwaysShowCartModeText = false

