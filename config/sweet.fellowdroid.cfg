[General]

## Master switch for the whole mod. Off means the droid stays exactly as Wesleys Enemies made it.
# Setting type: Boolean
# Default value: true
Enabled = true

## Show the stolen player name above the droid, exactly the way real player names show up. Turn it off if a fake name feels like too much.
# Setting type: Boolean
# Default value: true
CopyNameTag = true

## Keep the stolen look after the droid turns into its second form. On by default: the copied outfit is not visible on that form anyway, but the copied colours are, and the creature staying the player's colour reads better than it snapping back to a stock one. Turn it off for a completely plain fight.
# Setting type: Boolean
# Default value: true
KeepDisguiseAfterTransform = true

## Size correction for the copied cosmetics. The droid rig matches the player rig, so 1.0 should be right; raise or lower it only if things sit visibly too big or too small.
# Setting type: Single
# Default value: 1
Scale = 1

