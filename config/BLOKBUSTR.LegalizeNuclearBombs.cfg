EnableDebugLogging = false

[Explosion Delay]

## Time in seconds that the explosion will be delayed after the nuke has taken its last hit. Can be adjusted to match the length of a custom sound added with loaforcsSoundAPI, as long as it's under 10 seconds. Please do not change if using the default sound.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
ExplosionDelayTime = 3

## The volume of the explosion delay sound.
# Setting type: Single
# Default value: 0.65
# Acceptable value range: From 0 to 1
ExplosionDelayVolume = 0.65

## Whether to play particle effects during the explosion delay.
# Setting type: Boolean
# Default value: true
ExplosionDelayParticles = true

## Whether to play the camera glitch effect to players holding the nuke when its explosion delay begins.
# Setting type: Boolean
# Default value: true
