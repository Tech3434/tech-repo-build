[BlastCrew]

## Speed factor of the sluggish 2nd head in the volley (1 = normal Cleanup Crew head speed).
# Setting type: Single
# Default value: 0.5
SlowHeadSpeed = 0.5

## Speed factor of the frantic 3rd head in the volley (1 = normal Cleanup Crew head speed).
# Setting type: Single
# Default value: 2
FastHeadSpeed = 2

## Reference horizontal head speed (m/s) that the slow/fast factors scale. The head's speed is capped at this x factor.
# Setting type: Single
# Default value: 4
BaseHeadSpeed = 4

## Extra homing force applied to the fast head per (factor-1) so it actually reaches its higher speed and tracks the player.
# Setting type: Single
# Default value: 12
FastHeadHomingForce = 12

## How long each of the two EXTRA heads chases before it detonates. Set to roughly match the vanilla head's own fuse (~7s) so all three explode together — only their movement SPEED differs (0.5x / 2x).
# Setting type: Single
# Default value: 7
HeadFlightSeconds = 7

## Explosion damage of each extra head. The original vanilla head still remains in the three-head volley.
# Setting type: Int32
# Default value: 75
ExtraHeadDamage = 75

[Mutation]

## Normal mutation chance per displayed level (0.05 = 5%). Each eligible enemy or group rolls at displayed level times this value, up to MaxChance. In multiplayer the lobby host's value applies.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 0,5
ChancePerLevel = 0.05

## Upper limit for a normal mutation roll (0.5 = 50%). Surge levels use guaranteed rolls. In multiplayer the lobby host's value applies.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 0,5
MaxChance = 0.5

## Maximum number of distinct enemy bodies that can become mutants in one level, including guaranteed surge levels. A four-Gnome Hooligan group uses four slots and Big Bang uses one. A respawning enemy does not use another slot. Default 6. Set to 0 for unlimited mutations (the previous behaviour). In multiplayer the lobby host's value applies; choose it before opening the room.
# Setting type: Int32
# Default value: 6
MaxMutantsPerLevel = 6

## Base health multiplier applied to every mutated enemy.
# Setting type: Single
# Default value: 1.5
HealthMultiplier = 1.5

## Extra health multiplier per completed level. Default 0 keeps mutants at 1.5x native health at every level.
# Setting type: Single
# Default value: 0
HealthBonusPerLevel = 0

## Hard cap for the level-scaled mutant health multiplier.
# Setting type: Single
# Default value: 1.5
MaxHealthMultiplier = 1.5

## Range of the coloured aura light attached to every mutated enemy (works even on invisible enemies).
# Setting type: Single
# Default value: 6
AuraLightRange = 6

## Brightness of the coloured aura light.
# Setting type: Single
# Default value: 12
AuraLightIntensity = 12

## Comma-separated mutant names to exclude from natural spawns (for example: Power Leech, Boomday Boy, Ronin). In multiplayer the lobby host's list applies.
# Setting type: String
# Default value: 
DisabledMutants = 

## Every Nth displayed level uses a 100% mutation roll for supported enemies, subject to MaxMutantsPerLevel and DisabledMutants. Default 5 means levels 5, 10, 15, ... Set to 0 to disable. In multiplayer the lobby host's value applies.
# Setting type: Int32
# Default value: 5
GuaranteedSurgeInterval = 5

