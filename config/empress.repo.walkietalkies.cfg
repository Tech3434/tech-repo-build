## Settings file was created by plugin EMPRESS Walkie Talkies v1.3.0
## Plugin GUID: empress.repo.walkietalkies

[Appearance]

## Local walkie color preset.
# Setting type: String
# Default value: Empress
# Acceptable values: Empress, Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink, White, Black
WalkieColor = Empress

## When true, logs client walkie colors once per changed sync.
# Setting type: Boolean
# Default value: false
LogClientColors = false

[Battery (host only)]

## Walkie battery capacity.
# Setting type: Int32
# Default value: 40
# Acceptable value range: From 5 to 200
MaxBattery = 40

## Recharge slowly when not transmitting.
# Setting type: Boolean
# Default value: true
RechargeDuringLevel = true

[Controls]

## Key to hold for radio talk. Example: V, F, Mouse4, LeftShift
# Setting type: String
# Default value: V
PushToTalkKey = F

[Enemies (host only)]

## If true, enemy AI will get an investigate ping when a player transmits.
# Setting type: Boolean
# Default value: true
EnemiesHearRadio = true

[Visual]

## World size of the radio model.
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0,005 to 1
WorldScale = 0.05

## Roll degrees for the radio model.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 45
RollDegrees = 0

