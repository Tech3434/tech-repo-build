## Settings file was created by plugin Paranoia v0.2.0
## Plugin GUID: kinglir.paranoia

[Debug]

## Endast för test: sinnesnärvaron står på 0, så hallucinationerna kommer ofta.
# Setting type: Boolean
# Default value: false
TestHallucinations = false

[Hallucinations]

## Fiendeljud bakom eller bredvid spelaren.
# Setting type: Boolean
# Default value: true
FakeSounds = true

## En fiende syns en kort stund och försvinner när man tittar på den eller går närmare.
# Setting type: Boolean
# Default value: true
FakeEnemies = true

## En kopia av en lagkamrat (eller av dig själv) står med sidan mot dig, vänder sig långsamt om när du tittar och säger något.
# Setting type: Boolean
# Default value: true
FakeTeammates = true

## Den falska lagkamraten säger en slumpad replik med spelets TTS-röst.
# Setting type: Boolean
# Default value: true
TeammateVoice = true

## Spelets skräckeffekt (skak, vinjett, ljud) när en synlig hallucination avslöjar sig.
# Setting type: Boolean
# Default value: true
ScareEffect = true

## Minsta tid (s) mellan skräckeffekterna.
# Setting type: Single
# Default value: 15
ScareCooldown = 15

[Sanity]

## Hur mycket sinnesnärvaron (0-100) sjunker per sekund när ingen lagkamrat är inom 12 m.
# Setting type: Single
# Default value: 0.6
DrainAlone = 0.6

## Extra minskning per sekund när ficklampan är släckt.
# Setting type: Single
# Default value: 0.3
DrainDark = 0.3

## Extra minskning per sekund när hälsan är under hälften.
# Setting type: Single
# Default value: 0.3
DrainHurt = 0.3

## Hur mycket den stiger per sekund med en lagkamrat inom 6 m (i lastbilen återställs den helt).
# Setting type: Single
# Default value: 1.5
RecoverNearFriends = 1.5

## Under denna nivå börjar hallucinationerna.
# Setting type: Single
# Default value: 70
Threshold = 70

## Ungefärlig tid (s) mellan hallucinationer precis under gränsen.
# Setting type: Single
# Default value: 45
IntervalAtThreshold = 45

## Ungefärlig tid (s) mellan hallucinationer vid noll.
# Setting type: Single
# Default value: 8
IntervalAtZero = 8

