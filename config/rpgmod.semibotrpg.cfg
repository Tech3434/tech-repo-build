# Default value: true
Contracts = true

## Выборы перков и открытия.
# Setting type: Boolean
# Default value: true
Perks = true

## Покупки в магазине мода и прочие мелкие уведомления.
# Setting type: Boolean
# Default value: true
Other = true

## Полученная валюта (и подарки).
# Setting type: Boolean
# Default value: true
Currency = true

## Сколько секунд держится каждое уведомление.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 1 to 8
Duration = 2.5

## Сколько уведомлений показывается одновременно, не больше.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 8
MaxStack = 5

## Полученные данные исследований и завершённые исследования.
# Setting type: Boolean
# Default value: true
Research = true

[Performance]

## Auto (выбирает Low, Medium или High по времени кадра за первую минуту игры), Low, Medium, High или Custom (задаётся вручную ниже / в разделе HUD).
# Setting type: PerfPreset
# Default value: Medium
# Acceptable values: Auto, Low, Medium, High, Custom
Preset = Medium

## Полосы здоровья Медика над головами: наибольшее расстояние в метрах, на котором они видны (не больше собственной дальности Медика).
# Setting type: Single
# Default value: 120
# Acceptable value range: From 10 to 120
HealthBarRange = 120

## Сколько колец и меток способностей на полу показывается одновременно (самое старое уступает место).
# Setting type: Int32
# Default value: 12
# Acceptable value range: From 4 to 12
MaxEffectRings = 12

## Что Auto выбрал в прошлый раз (для сведения).
# Setting type: String
# Default value: 
AutoPicked = 

[Perks]

## Выбор перка каждые N уровней вашего лучшего класса в этом забеге (0 = перки выключены).
# Setting type: Int32
# Default value: 5
PerkEvery = 5

## Сколько перков предлагается на выбор.
# Setting type: Int32
# Default value: 3
PerkChoices = 3

## Проклятые перки (сильный бонус с настоящим недостатком) могут попадаться среди предложенных. Выкл.: не предлагаются, а уже имеющиеся проклятые перки ничего не делают.
# Setting type: Boolean
# Default value: true
CursedPerks = true

## Эволюция перков: некоторые перки превращаются в более сильную версию после испытания во время забега.
# Setting type: Boolean
# Default value: true
Evolutions = true

## Бонусы тегов: 3 или 5 перков с одним тегом дают бонус.
# Setting type: Boolean
# Default value: true
TagBonuses = true

## Каждый переброс перков на одном уровне стоит на столько лома дороже (первый стоит Shop > PerkRerollScrap).
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 0 to 500
RerollStep = 15

## Сколько перков каждый игрок может изгнать за забег (изгнанный перк больше не предлагается). 0 = выкл.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 5
Banishes = 1

[Players]

## Размер лобби (игроков). 6 = как в обычной игре. Задайте до создания лобби; изменение в лобби применяется сразу. RepoRPG нужен всем. Уступает, если установлен другой мод на увеличение числа игроков.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 20
MaxPlayers = 6

[Research]

## Исследования: зарабатывайте данные исследований в забегах (образцы, боссы, этапы, некоторые контракты) и тратьте их на проекты, которые навсегда открывают новые механики (хранятся в вашем аккаунте, забег их не сбрасывает).
# Setting type: Boolean
# Default value: true
Enabled = true

## Открытия на всё лобби (особенности карт, разделы магазина, правила извлечения...): Host = решают исследования хоста; Anyone = всё, что исследовал кто-либо в лобби.
# Setting type: ResearchLobbyRule
# Default value: Host
# Acceptable values: Host, Anyone
LobbyRule = Host

## Данные исследований из всех источников (задаётся сложностью: Relaxed 0.5, Easy 0.75, Normal 1, Hard 1.35, Brutal 1.75).
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
DataMultiplier = 1

## Стоимость исследовательских проектов (% от обычной).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 10 to 500
CostScale = 100

## Шанс (%) ещё одного образца для исследований на уровне (третьего: вероятнее в глубине забега и на высоких сложностях). На каждом уровне есть как минимум SamplesPerLevel.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 0 to 100
SampleChance = 50

## Сколько образцов для исследований есть на каждом уровне как минимум (всего 1-3 на уровень).
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 3
SamplesPerLevel = 1

[Routes]

## Выбор маршрута: после каждого обычного уровня команда голосует за маршрут следующего уровня - безопасный или один из двух рискованных (у каждого свой риск и своя награда). Выкл.: модификаторы карты выпадают случайно, как раньше.
# Setting type: Boolean
# Default value: true
Enabled = true

[RPG]

## Очков характеристик за уровень класса.
# Setting type: Int32
# Default value: 2
AttributePointsPerLevel = 2

## Сколько снаряжения можно носить; когда место кончается, самый слабый предмет разбирается на опыт.
# Setting type: Int32
# Default value: 16
InventorySize = 16

## Шанс (%) каждого игрока найти снаряжение при завершении точки извлечения.
# Setting type: Single
# Default value: 35
GearChanceOnExtraction = 35

## Множитель опыта за убийство Чемпионов (у Владык на единицу больше).
# Setting type: Int32
# Default value: 2
EliteXpMultiplier = 2

## Хост: ценности получают редкость от обычной до легендарной, а редкие и выше стоят дороже.
# Setting type: Boolean
# Default value: true
ValuableRarity = true

## Хост: некоторые враги появляются элитными, с модификаторами.
# Setting type: Boolean
# Default value: true
EliteEnemies = true

## Шанс (%), что враг окажется элитным на первом уровне.
# Setting type: Single
# Default value: 15
EliteBaseChance = 15

## Дополнительный % элиты за каждый пройденный уровень.
# Setting type: Single
# Default value: 2.5
EliteChancePerLevel = 2.5

## Предел % элиты.
# Setting type: Single
# Default value: 50
EliteMaxChance = 50

## Не используется с версии 1.0.20: контракты берутся с доски контрактов ([Contracts]).
# Setting type: Int32
# Default value: 3
ContractsPerLevel = 3

## Опыт мода за использование улучшения из магазина (x1.5 за каждую ступень редкости, x2 для любимых улучшений вашего класса).
# Setting type: Int32
# Default value: 24
UpgradeXp = 24

## Улучшения из магазина получают редкость: редкие и выше дают ещё и очко характеристик, эпические и выше - снаряжение, легендарные - выбор перка.
# Setting type: Boolean
# Default value: true
UpgradeRarity = true

[Rules]

## Падение за пределы уровня убивает (в обычной игре вас просто возвращает в грузовик). Спасение от смерти (Второй шанс, Пластина феникса, Последний рубеж) ловит падение и тратит заряд; вы возвращаетесь в грузовик с 1 ОЗ.
# Setting type: Boolean
# Default value: true
LethalFalls = true

## Предел (%) снижения урона от всего вместе: пассивные умения, снаряжение, характеристики, перки, способности и ауры союзников. (Неуязвимость «Фазового сдвига» считается отдельно.)
# Setting type: Single
# Default value: 85
# Acceptable value range: From 0 to 99
MaxTotalDamageReduction = 85

## Предел (%) снижения урона от усиления способности с учётом силы способности (например, «Железная стена»).
# Setting type: Single
# Default value: 80
# Acceptable value range: From 0 to 99
MaxActiveDamageReduction = 80

## Предел (%) общего бонуса к скорости ходьбы / бега от всех источников вместе.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 500
MaxSpeedBonus = 100

## Предел множителя «Вдвое или ничего» со всеми талантами и благословениями.
# Setting type: Single
# Default value: 3.8
# Acceptable value range: From 1 to 10
MaxBetMultiplier = 3.8

## Разрешить бесплатный возврат всех очков навыков.
# Setting type: Boolean
# Default value: true
AllowRespec = true

## Больше не используется: классы выбираются только в лобби и на уровне магазина.
# Setting type: Boolean
# Default value: false
AllowClassSwitchInLevel = false

## Предел (%) постоянного снижения урона от пассивных умений и навыков. Активные способности могут его превышать.
# Setting type: Single
# Default value: 70
MaxDamageReduction = 70

## Предел (%) шанса уклонения.
# Setting type: Single
# Default value: 50
MaxDodgeChance = 50

## Предел (%) сокращения перезарядки.
# Setting type: Single
# Default value: 60
MaxCooldownReduction = 60

## Предел (%) того, насколько меньше стоимости теряет предмет, повреждённый у вас в руках (таланты Носильщика).
# Setting type: Single
# Default value: 70
MaxHeldItemProtection = 70

## Предел (%) стоимости, которую Оценщик добавляет каждой ценности в своей ауре.
# Setting type: Single
# Default value: 50
MaxAppraiseBonus = 50

## Множитель для всех бонусов к восстановлению выносливости (перки, характеристики, снаряжение, таланты, «Энергосвязь»). 1 = как в описании; 0 = выкл. Бонусы действуют, только пока сама игра восстанавливает выносливость.
# Setting type: Single
# Default value: 1
StaminaRegenBonusScale = 1

## Предел общей дополнительной выносливости в секунду от бонусов к восстановлению.
# Setting type: Single
# Default value: 20
MaxStaminaRegenBonus = 20

## Предел (%) общего бонуса к максимальной выносливости от всех источников вместе (перки, характеристики, снаряжение, таланты, комплекты).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 500
MaxStaminaBonus = 100

## Предел (%) того, насколько меньше выносливости тратится на бег / переноску, от всех источников вместе. (Бесплатные первые секунды бега от «Пёрышка» считаются отдельно.)
# Setting type: Single
# Default value: 60
# Acceptable value range: From 0 to 100
MaxStaminaDrainReduction = 60

## Нижняя граница (% от обычной игры) расхода выносливости на бег после всех эффектов - RepoRPG и модов на улучшения (Sprint Usage из MoreUpgrades) вместе - чтобы бег всегда чего-то стоил. (Бесплатные первые секунды от «Пёрышка» считаются отдельно.) 0 = без границы.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 0 to 100
MinSprintDrain = 40

## Хост: когда одна покупка улучшения даёт игроку больше одного уровня (улучшение делят несколько модов: игра, командная настройка MoreUpgrades, мод на общие улучшения), оставить один уровень и записать в журнал, какие моды его делят.
# Setting type: Boolean
# Default value: true
FixDoubleSharedUpgrades = true

## Предел (%) снижения урона для союзников от «Стены щитов» Джаггернаута.
# Setting type: Single
# Default value: 35
MaxShieldWall = 35

## Предел (%) снижения урона для союзников с низким здоровьем от «Стабилизации» Медика.
# Setting type: Single
# Default value: 60
MaxStabilize = 60

## Предел (%) снижения урона от «Рубцовой ткани» Выжившего.
# Setting type: Single
# Default value: 30
MaxScarTissue = 30

## Предел (%) дополнительного урона по врагам, отмеченным Стражем.
# Setting type: Single
# Default value: 60
MaxMarkDamage = 60

## Предел (%) того, насколько тише Скрытность (и снаряжение) может сделать игрока.
# Setting type: Single
# Default value: 40
MaxNoiseReduction = 40

## Предел (%) бонуса Удачи сверх доли валюты игрока.
# Setting type: Single
# Default value: 25
MaxScrapBonus = 25

[Scaling]

## Масштабировать сложность по числу игроков, рассчитывается в начале каждого уровня (1.0 при 4 игроках и меньше).
# Setting type: Boolean
# Default value: true
Enabled = true

## Масштабировать и при числе игроков меньше 4 (меньше монстров, меньше ценностей, ниже цель).
# Setting type: Boolean
# Default value: false
ScaleSmallLobbies = false

## Общая сила масштабирования (%), для всех категорий.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 200
Strength = 100

## Количество монстров и частота их возрождения (% от стандартной кривой: x2.2 при 20 игроках).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 200
Monsters = 100

## Здоровье монстров (% от стандартной кривой: x1.6 при 20 игроках).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 200
Health = 100

## Урон монстров (% от стандартной кривой: x1.4 при 20 игроках). По умолчанию выключено.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 200
Damage = 0

## Количество и стоимость ценностей (% от стандартной кривой: x2.5 при 20 игроках).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 200
Valuables = 100

## Цель по добыче (% от стандартной кривой: x2.2 при 20 игроках).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 200
HaulGoal = 100

## Шанс элиты (% от стандартной кривой: x1.6 при 20 игроках; предел элиты остаётся) и дополнительный модификатор босса при 12 и более игроках.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 200
Elites = 100

## Лом за добычу: 100 = каждый игрок зарабатывает примерно столько же, сколько в игре на 4 игроков. 0 = добыча делится как обычно.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 200
Economy = 100

[Season]

## Сезон: забег - это заданное число глав с финальным боссом в конце. Победите его, затем проголосуйте - закончить забег или продолжать (бесконечный режим). Выкл.: главы идут без финишной черты, как раньше.
# Setting type: Boolean
# Default value: true
Enabled = true

## Длина забега: Short - 5 глав x 5 уровней (25), Standard - 10 x 5 (50), Marathon - 10 x 7 (70) или Custom (Season/Chapters x Milestones/Every).
# Setting type: RunLength
# Default value: Standard
# Acceptable values: Short, Standard, Marathon, Custom
Length = Standard

## Своя длина: сколько глав (в каждой Milestones/Every уровней).
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 3 to 20
Chapters = 10

[Shop]

## Разрешить покупки в магазине мода вне магазина игры.
# Setting type: Boolean
# Default value: false
ShopAnywhere = false

## Показывать всем сообщение, когда кто-то покупает что-нибудь в магазине мода.
# Setting type: Boolean
# Default value: true
ShowPurchases = true

## Цена в ломе: случайное снаряжение, необычное или лучше.
# Setting type: Int32
# Default value: 40
GearCrateScrap = 40

## Разборка: дополнительный лом за каждое свойство сверх обычного для редкости числа (базовый лом за редкость - salvageScrap в rpg.json).
# Setting type: Int32
# Default value: 1
SalvageExtraLineScrap = 1

## Разборка: дополнительный лом за снаряжение с уникальным эффектом.
# Setting type: Int32
# Default value: 3
SalvageUniqueScrap = 3

## Разборка: та часть стоимости предмета, что куплена за лом (ящики, перебросы, улучшения), возвращает не больше этого % потраченного лома - так что покупка ради разборки всегда убыточна.
# Setting type: Single
# Default value: 50
# Acceptable value range: From 0 to 90
SalvageMaxOfSpent = 50

## Разборка также даёт опыт за разборку по редкости, как и раньше.
# Setting type: Boolean
# Default value: true
SalvageGivesXp = true

## Цена в ломе: случайное снаряжение, редкое или лучше.
# Setting type: Int32
# Default value: 100
PremiumCrateScrap = 100

## Цена в ломе: перебросить свойства предмета снаряжения (та же редкость).
# Setting type: Int32
# Default value: 30
GearRerollScrap = 30

## Цена в ломе: перебросить предмет снаряжения на редкость выше.
# Setting type: Int32
# Default value: 80
GearUpgradeScrap = 80

## Цена в ломе: новые варианты перков.
# Setting type: Int32
# Default value: 30
PerkRerollScrap = 30

## Сколько слотов снаряжения добавляется в сменный ассортимент каждого игрока (или убирается из него).
# Setting type: Int32
# Default value: 0
# Acceptable value range: From -2 to 3
RotationSize = 0

## Умножает цены ассортимента, модулей, расходников, услуг и ящиков.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,25 to 4
PriceMultiplier = 1

## Репутация за каждую единицу лома, потраченную в магазине мода.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 5
ReputationSpeed = 1

## Продавать ящики с сюрпризом.
# Setting type: Boolean
# Default value: true
Crates = true

## Сколько разных расходников игрок может купить за одно посещение магазина (по 1 каждого).
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 0 to 6
ConsumablesPerLevel = 3

## Сколько лома стоит зафиксировать товар, чтобы он остался до следующей смены ассортимента.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 0 to 200
LockFee = 10

## Цена в ломе за возврат очков навыков или характеристик (0 = бесплатно, где угодно).
# Setting type: Int32
# Default value: 20
RespecScrap = 20

## Разборка: умножает лом, который даёт каждый разобранный предмет (%).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 300
SalvageMultiplier = 100

[Starters]

## Стартовое снаряжение: каждый класс один раз за забег получает один небольшой обычный предмет, привязанный к классу (его нельзя разобрать на лом или перебросить).
# Setting type: Boolean
# Default value: true
Gear = true

## Стартовые инструменты: Медик, Плут, Подрывник и Оружейник на своём первом уровне забега получают ещё и предмет из магазина, он появляется рядом с ними (25 лома взамен, если такого предмета в игре нет).
# Setting type: Boolean
# Default value: true
Tools = true

[Streaks]

## Серия команды: каждый пройденный подряд уровень увеличивает серию; каждый уровень серии даёт больше опыта, лома и удачи, вплоть до предела. Смерти немного уменьшают серию, проигранный уровень её сбрасывает.
# Setting type: Boolean
# Default value: true
Enabled = true

## Бонус к опыту (%) за уровень серии.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 20
XpPerLevel = 4

## Бонус к лому за добычу (%) за уровень серии.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0 to 20
ScrapPerLevel = 4

## Удача в снаряжении и магазине за уровень серии.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 5
LuckPerLevel = 0.5

## Сколько уровней серии учитывается для бонуса (сама серия продолжает считаться).
# Setting type: Int32
# Default value: 8
# Acceptable value range: From 0 to 30
Cap = 8

## Сколько уровней серии теряется, когда игрок погибает (спасение от смерти не считается).
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 0 to 10
DeathPenalty = 1

## Проигранный уровень (команда не провела извлечение): Reset = серия обнуляется, Halve = уменьшается вдвое.
# Setting type: StreakFail
# Default value: Reset
# Acceptable values: Reset, Halve
FailMode = Reset

## Предел (%) бонусов серии, главы и команды к опыту / лому вместе.
