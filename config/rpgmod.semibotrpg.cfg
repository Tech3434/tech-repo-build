# Acceptable value range: From 1 to 10
CallOutMax = 3

## Медик / Гробовщик: дополнительный опыт за возрождение (%), если оно произошло в течение 20 с после смерти (падает до 20% к 45 с и до 0 к 90 с).
# Setting type: Single
# Default value: 60
# Acceptable value range: From 0 to 200
ClutchReviveBonus = 60

## Хост: показывать список классов и на уровне магазина.
# Setting type: Boolean
# Default value: false
RosterInShop = false

[TeamContracts]

## На каждом уровне предлагается один необязательный рискованный командный контракт, за который голосует лобби.
# Setting type: Boolean
# Default value: true
TeamContracts = true

## Majority: больше половины поданных голосов (при равенстве - отказ). Unanimous: «за» голосует каждый игрок в лобби. Host: считается только голос хоста.
# Setting type: TeamVote
# Default value: Majority
# Acceptable values: Majority, Host, Unanimous
VoteMode = Majority

## Секунд на голосование после начала уровня.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 10 to 180
VoteSeconds = 40

## Умножает все награды и потери командных контрактов.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,25 to 4
StakeScale = 1

[Threat]

## С модом Mutators, на уровне с мутатором: Stack = RepoRPG масштабирует как обычно; SkipThreat = на этом уровне нет угрозы от хода забега (и её наград тоже); SkipDanger = нет ещё и опасности от числа игроков (больше монстров, здоровья, урона, элиты) на этом уровне - добыча и цель всё равно масштабируются.
# Setting type: MutatorMode
# Default value: SkipThreat
# Acceptable values: Stack, SkipThreat, SkipDanger
WithMutators = SkipThreat

## Ход забега: каждый пройденный уровень повышает рейтинг угрозы (действует со следующего уровня): уровни становятся тяжелее и насыщеннее, а награды - лучше.
# Setting type: Boolean
# Default value: true
Enabled = true

## Как быстро рейтинг угрозы растёт за пройденный уровень (1 = сначала примерно +1 за уровень, с замедлением ближе к пределу). «Нормально»: 0.6 с версии 1.0.55, чтобы монстры крепли в том же темпе, в каком растут уровни класса.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0,1 to 5
Speed = 0.6

## Наибольшее значение рейтинга угрозы (0 = выкл.). При 10: монстры x1.4, здоровье x1.5, элита x1.6, добыча x1.3, награды x1.4.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 20
MaxRating = 10

