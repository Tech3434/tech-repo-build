[Crew]

## Уровень команды: общий уровень команды на забег (1-10), растёт от всего, что делает команда; каждый уровень даёт небольшой бонус всей команде.
# Setting type: Boolean
# Default value: true
Enabled = true

## Получаемый опыт команды (%).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 400
XpScale = 100

[Currency]

## Полное название валюты мода.
# Setting type: String
# Default value: RPG Scrap
Name = RPG Scrap

## Короткое название, которое показывается рядом с суммами.
# Setting type: String
# Default value: Scrap
ShortName = Scrap

## Один или два символа, которые показываются на значке валюты.
# Setting type: String
# Default value: S
Symbol = S

## Бонусная валюта, создаваемая, когда команда зарабатывает деньги, в % от них ($100 командных денег = 1 при 100%). Деньги команды при этом не уменьшаются.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 100
Percent = 10

## Equal: все в игре получают одинаковую долю. ByContribution: половина делится поровну, половина - по стоимости ценностей, вынесенных каждым игроком на этом уровне.
# Setting type: ScrapSplitMode
# Default value: Equal
# Acceptable values: Equal, ByContribution
SplitMode = Equal

## Баланс для игроков, новых в этом сохранении (включая тех, кто подключился посреди забега).
# Setting type: Int32
# Default value: 0
StartingAmount = 0

## Разрешить игрокам отдавать часть своей валюты напарникам (на вкладке «Магазин»).
# Setting type: Boolean
# Default value: false
AllowGifting = false

[Debug]

## Каждые 10 с записывает в журнал профиль интерфейса мода с пометкой [ui]: время кадра, память и сборки мусора, проходы OnGUI, проигранные и пропущенные звуки интерфейса, количество AudioSource и GameObject.
# Setting type: Boolean
# Default value: false
UiDiagnostics = false

## Проба HUD (вкладка Debug > Features): также перечислить элементы HUD под этой точкой экрана, в виде "x,y" в процентах от левого верхнего угла (например, "22,55"). Пусто = только центр экрана.
# Setting type: String
# Default value: 
HudProbePoint = 

## Крюк Крючника: на несколько секунд рисует луч прицеливания, точку попадания, край уступа и путь (зелёный = годится, красный = отказ) и записывает каждый шаг в журнал как [hook].
# Setting type: Boolean
# Default value: false
HookDebug = false

## Для проверки: любое ожидание RepoRPG (ответы хоста, построение уровня у поздно подключившегося) прекращается почти сразу - чтобы убедиться, что игра продолжается и без него.
# Setting type: Boolean
# Default value: false
ForceWaitTimeouts = false

## Записывает в журнал каждый шаг выполнения и оплаты контракта как [contracts], с отметкой времени (мс) и номером кадра.
# Setting type: Boolean
# Default value: false
ContractDebug = false

## «Полевая сортировка» Медика: каждые 3 с записывает в журнал как [triage] каждый шаг показа полос здоровья над напарниками (проверка класса, настройки, здоровье от хоста, найденные аватары, камера, положение каждого напарника на экране, расстояние и причина, по которой полоса скрыта).
# Setting type: Boolean
# Default value: false
TriageDebug = false

## Каждые 2 с, пока вы бежите, записывает в журнал как [stamina]: максимальную и текущую выносливость, измеренный расход в секунду, расход, который использует игра, каждый бонус к выносливости и его предел, бонус к восстановлению и частоту кадров.
# Setting type: Boolean
# Default value: false
StaminaDebug = false

## Записывает в журнал (по одному разу) каждый текст интерфейса мода, цвет которого не проходит минимум контраста (4.5:1 для текста, 3:1 для заголовков) на панелях темы.
# Setting type: Boolean
# Default value: false
LogContrast = false

## Записывает в журнал всё, что может вызывать мерцание HUD: перестроения текстуры шрифта, скрытие / показ HUD, перезагрузку данных забега, смены класса / темы (со счётчиками каждые 10 с), а также каждое изменение того, что рисует панель контрактов (номер кадра, что изменилось, стек вызовов), двойную отрисовку, лишние экземпляры и другой интерфейс поверх неё. Пишет очень много: только для проверки.
# Setting type: Boolean
# Default value: false
HudDiagnostics = false

## Записывает в журнал каждый этап применения способности класса (клавиша, проверки, что было запрошено у хоста, что он сделал) - чтобы найти способность, которая ничего не делает.
# Setting type: Boolean
# Default value: false
AbilityDiagnostics = false

## Только для проверки: отбрасывает такой % сообщений RepoRPG, получаемых вашей игрой, чтобы убедиться, что всё, что ждёт другого игрока, корректно завершается по времени. 0 = выкл.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 100
NetDropPercent = 0

## Хост: рисует у каждой самоходной тележки контур (голубой), маршрут (зелёный, центры проёмов жёлтые), пробы пола (зелёный - пол, красный - обрыв, синий - стена сбоку), боковые касания (оранжевый) и преграды (красный) и записывает в журнал каждую причину остановки как [cart stop].
# Setting type: Boolean
# Default value: false
CartDebugDraw = false

## Хост: измеряет каждый дверной проём / узкий проход, в который въезжает самоходная тележка (его ширина в сравнении с тележкой, каждая остановка и её причина, касания, откаты), и записывает итоги в BepInEx/config/RepoRPG_cart_doorways.txt. В журнале - как [cart doorway].
# Setting type: Boolean
# Default value: false
CartDoorwayReport = false

## Дважды в секунду записывает в журнал данные самоходных тележек: целевую и действительную скорость, приложенное изменение скорости, массу, груз, сопротивление, что её замедляет, и измеренные скорости игроков. Клиенты записывают скорость, которую видят.
# Setting type: Boolean
# Default value: false
CartSpeedLog = false

## Только для проверки: задерживает каждое сообщение RepoRPG, получаемое вашей игрой, на столько миллисекунд. 0 = выкл.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 20000
NetDelayMs = 0

## Только хост: добавляет вкладку Debug с инструментами проверки (опыт, уровни, снаряжение, элита, деньги, пропуск уровня, смена класса, установка уровня, очки навыков, запуск любой активной способности, имитация смертей, разбор характеристик) и записывает в журнал каждый этап способности. Клиентам не передаётся.
# Setting type: Boolean
# Default value: false
DebugTools = false

## Записывает в журнал каждое заблокированное или разрешённое возрождение убитого босса как [boss].
# Setting type: Boolean
# Default value: false
BossDebug = false

## Измеряет, во что RepoRPG обходится этому компьютеру: каждую минуту - FPS, время кадра, собственное время мода и выделения памяти за кадр, сборки мусора, память, сетевой обмен, где вы находитесь, самые затратные места по порядку и коллекции, которые продолжают расти -> BepInEx/config/RepoRPG_perf.txt (и [perf] в журнале). Выкл.: без затрат.
# Setting type: Boolean
# Default value: false
PerfProbe = false

## Каждые 30 с записывает в журнал как [netmeter]: сообщения RepoRPG и байты в секунду (отправлено / получено, по типам), частоту сообщений Photon, FPS, худший кадр и собственные затраты мода на кадр. Для замеров в больших лобби.
# Setting type: Boolean
# Default value: false
NetMeter = false

[Difficulty]

## Ступень выплат: дополнительный риск ради дополнительной награды, поверх пресета сложности (пресеты её не трогают). Выплата: Relaxed x0.8, Standard x1, Hard x1.3, Brutal x1.7, Nightmare x2.2.
# Setting type: DifficultyTier
# Default value: Standard
# Acceptable values: Relaxed, Standard, Hard, Brutal, Nightmare
Tier = Standard

## Модификатор: не больше одного спасения от смерти за уровень (+0.2 к выплате).
# Setting type: Boolean
# Default value: false
Hardcore = false

## Модификатор: все наносят на 30% больше урона и получают на 30% больше (+0.15).
# Setting type: Boolean
# Default value: false
GlassCannon = false

## Модификатор: магазин мода закрыт весь забег (+0.2).
# Setting type: Boolean
# Default value: false
NoShop = false

## Модификатор: ценности получают на 25% больше урона от ударов (+0.15).
# Setting type: Boolean
# Default value: false
FragileGoods = false

## Модификатор: шанс элиты удвоен (+0.25).
# Setting type: Boolean
# Default value: false
EliteSwarm = false

## Модификатор: без синергий команды (+0.1).
# Setting type: Boolean
# Default value: false
LoneWolves = false

## Модификатор: лом за добычу уменьшен вдвое (+0.1, лом не увеличивает).
# Setting type: Boolean
# Default value: false
ThinWallets = false

## Модификатор: без лечения от способностей и снаряжения, регенерация выключена (+0.25).
# Setting type: Boolean
# Default value: false
IronBodies = false

## Модификатор: перезарядка способностей на 25% дольше (+0.15).
# Setting type: Boolean
# Default value: false
ShortFuse = false

## Модификатор: подписи угрозы, метки сканирования и сигналы сторожевого поста выключены (+0.1).
# Setting type: Boolean
# Default value: false
Blackout = false

## Пресет сложности, выбранный переключателем «Сложность» (Relaxed, Easy, Normal, Hard, Brutal). Выбор пресета загружает его значения в настройки хоста; этот параметр лишь запоминает, какой это был пресет (переключатель показывает «Свой (на основе ...)», как только какая-то настройка от него отличается).
# Setting type: DifficultyPreset
# Default value: Normal
# Acceptable values: Relaxed, Easy, Normal, Hard, Brutal
Preset = Normal

## Количество монстров и частота их возрождения на каждом уровне (%), до масштабирования по числу игроков и хода забега.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 25 to 300
MonsterCount = 100

## Здоровье монстров на каждом уровне (%), до масштабирования по числу игроков и хода забега.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 25 to 300
MonsterHealth = 100

## Урон монстров по игрокам на каждом уровне (%), до масштабирования по числу игроков, хода забега и ступени выплат.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 25 to 300
MonsterDamage = 100

[Elements]

## Стихийное оружие: Огонь, Разряд, Мороз, Коррозия и Пустота от свойств оружейных модулей, стихийных модулей и покрытий из магазина; состояния на монстрах, комбинации, сопротивления и слабости элиты.
# Setting type: Boolean
# Default value: true
Enabled = true

## Насколько сильны стихийные эффекты (% от обычного: урон, действие накоплений, время оглушения и заморозки).
# Setting type: Single
# Default value: 100
# Acceptable value range: From 0 to 300
Strength = 100

## Эффекты стихий: Full (свечение оружия и значки состояний), Reduced (только значки состояний), Off (только значки состояний, без свечения). Режим «Меньше эффектов» тоже отключает свечение.
# Setting type: ElementVfx
# Default value: Full
# Acceptable values: Full, Reduced, Off
Vfx = Full

[Healing]

## Предел вашей регенерации ОЗ в секунду от всех источников.
# Setting type: Single
# Default value: 0.6
MaxHealthRegen = 0.6

## Секунд после получения урона до возобновления регенерации.
# Setting type: Single
# Default value: 6
RegenDelay = 6

## Предел ОЗ, которые аура лечения даёт каждому союзнику раз в 3 секунды.
# Setting type: Single
# Default value: 4.5
MaxAllyHealPerPulse = 4.5

## Предел ОЗ, восстанавливаемых при гибели врага рядом с вами.
# Setting type: Single
# Default value: 20
MaxHealOnKill = 20

## Предел ОЗ, восстанавливаемых за попадание из оружия.
# Setting type: Single
# Default value: 3
MaxLifesteal = 3

## Предел дополнительных ОЗ для союзника, возрождённого рядом с вами.
# Setting type: Single
# Default value: 50
MaxReviveHeal = 50

## Предел ОЗ, восстанавливаемых при завершении точки извлечения.
# Setting type: Single
# Default value: 25
MaxExtractionHeal = 25

## Какая часть силы способности действует на лечение способностями (1 = вся, 0.5 = половина).
# Setting type: Single
# Default value: 1
HealPowerScaling = 1

[Heat]

## Накал: после каждого босса этапа команда голосует за карту накала (или пропуск). Накал за забег только растёт; каждая единица даёт больше лома за добычу и больше удачи в снаряжении и магазине.
# Setting type: Boolean
# Default value: true
Enabled = true

[HUD]

## Версия этих настроек HUD (чтобы будущие обновления могли их перенести). Не меняйте.
# Setting type: Int32
# Default value: 1
ConfigVersion = 1

## Карточка HUD слева внизу (главный переключатель): Always, TruckAndShop, LevelsOnly или Never. Выключение скрывает всю карточку; всё, что на ней показано, продолжает работать.
# Setting type: HudShow
# Default value: Always
# Acceptable values: Always, TruckAndShop, LevelsOnly, Never
Card = Always

## Карточка HUD: строка класса (значок класса, название и уровень).
# Setting type: Boolean
# Default value: true
Identity = true

## Карточка HUD: ваш лом, в строке класса.
# Setting type: Boolean
# Default value: true
Scrap = true

## Карточка HUD: полоса опыта.
# Setting type: Boolean
# Default value: true
XpBar = true

## Карточка HUD: строка способности (круг перезарядки, клавиша, название, состояние). Сама способность работает в любом случае.
# Setting type: Boolean
# Default value: true
Ability = true

## Карточка HUD: название способности в строке способности.
# Setting type: Boolean
# Default value: true
AbilityName = true

## Карточка HUD: строка под способностью с другими клавишами вашего класса (следование тележки, гул, передача, смена копии) и их состоянием. Только для классов, у которых они есть.
# Setting type: Boolean
# Default value: true
ExtraKeys = true

## Карточка HUD: собственные строки вашего класса (площадка доставки, состояние тележки, Воодушевление, скопированная способность, состояние Азартного игрока, враги поблизости...): Always, TruckAndShop, LevelsOnly или Never.
# Setting type: HudShow
# Default value: Always
# Acceptable values: Always, TruckAndShop, LevelsOnly, Never
ClassLines = Always

## Карточка HUD, забег: метки главы и следующего этапа.
# Setting type: Boolean
# Default value: true
ChipChapter = true

## Карточка HUD, забег: метка серии.
# Setting type: Boolean
# Default value: true
ChipStreak = true

## Карточка HUD, забег: метка накала.
# Setting type: Boolean
# Default value: true
ChipHeat = true

## Карточка HUD, забег: метка Вознесения.
# Setting type: Boolean
# Default value: true
ChipAscension = true

## Карточка HUD, забег: метка уровня команды.
# Setting type: Boolean
# Default value: true
ChipCrew = true

## Карточка HUD, забег: метка ступени выплат.
# Setting type: Boolean
# Default value: true
ChipPayout = true

## Карточка HUD, забег: метка модификатора карты.
# Setting type: Boolean
# Default value: true
ChipMapModifier = true

## Карточка HUD: метка выбранного маршрута (на уровнях).
# Setting type: Boolean
# Default value: true
ChipRoute = true

## Карточка HUD: метка «+N на трату».
# Setting type: Boolean
# Default value: true
ChipPointsToSpend = true

## Карточка HUD: метка догоняющего опыта.
