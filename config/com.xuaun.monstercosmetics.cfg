[Balloon]

## Pops when reaching this number of hits (0 = ignore hits, damage only).
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 0 to 20
HitsToPop = 3

## Pops when reaching this total accumulated damage (0 = ignore damage, hits only). Hits and damage work together: whichever is reached first pops the balloon.
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 0 to 500
DamageToPop = 60

## Seconds until the balloon comes back after popping.
# Setting type: Single
# Default value: 8
# Acceptable value range: From 0 to 60
RespawnSeconds = 8

## Duration in seconds of the inflate animation when it returns.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0 to 5
ReinflateSeconds = 0.6

## Spawn a colored particle burst when the balloon pops (matches the balloon color).
# Setting type: Boolean
# Default value: true
PopParticles = true

[Bomb & Dynamite]

## Breathing frequency in cycles per second (not a duration). Lower = slower.
