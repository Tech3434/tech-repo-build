# Default value: 0.6
# Acceptable value range: From 0,05 to 4
PulseSpeed = 0.6

## Breathing size change as a ratio (0.10 = grows/shrinks ±10%).
# Setting type: Single
# Default value: 0.1
# Acceptable value range: From 0 to 0,5
PulseStrength = 0.1

[General]

## Master switch for all monster-cosmetic behaviours.
# Setting type: Boolean
# Default value: true
BehavioursEnabled = true

## Log events to the console (verbose). Keep off for normal play.
# Setting type: Boolean
# Default value: false
