# Setting type: Single
# Default value: 3
StandSeconds = 3

## It raises spires at a player it can see at least this far away, metres...
# Setting type: Single
# Default value: 4
MinRange = 4

## ...and no farther than this, metres.
# Setting type: Single
# Default value: 14
MaxRange = 14

## Chance it raises spires when it can (0-1), checked every half second.
# Setting type: Single
# Default value: 0.5
Chance = 0.5

## The least time between spires, seconds.
# Setting type: Single
# Default value: 10
Cooldown = 10

[Swarm]

## A Colossus or Sovereign drops its jaw and shrieks this long before it bursts into a swarm of shards, seconds.
# Setting type: Single
# Default value: 0.8
WarnSeconds = 0.8

## How fast the swarm races along the floor, m/s. It can't be hurt or stunned while it does.
# Setting type: Single
# Default value: 7
Speed = 7

## It swarms at a player it can see at least this far away, metres...
# Setting type: Single
# Default value: 8
MinRange = 8

## ...and no farther than this, metres.
# Setting type: Single
# Default value: 25
MaxRange = 25

## It reforms this far in front of its target, metres.
# Setting type: Single
# Default value: 2.5
InFront = 2.5

## Damage to anyone the swarm passes through.
# Setting type: Single
# Default value: 10
Damage = 10

## How long it takes to pull itself back together, seconds, the mask last (also after pouring through a gap).
# Setting type: Single
# Default value: 0.8
ReformSeconds = 0.8

## After reforming it can't attack for this long, seconds: run.
# Setting type: Single
# Default value: 2
PauseSeconds = 2

## Chance it swarms when it can (0-1), checked every half second.
# Setting type: Single
# Default value: 0.35
Chance = 0.35

## The least time between swarms, seconds.
# Setting type: Single
# Default value: 18
Cooldown = 18

[Swipe]

## How far a Stalker's swipe reaches, metres from its middle. It swipes at players within about 85% of this.
# Setting type: Single
# Default value: 1.5
StalkerReach = 1.5

## How far a Brute's swipe reaches, metres from its middle. It swipes at players within about 85% of this.
# Setting type: Single
# Default value: 1.9
BruteReach = 1.9

## How far a Colossus's swipe reaches, metres from its middle. It swipes at players within about 85% of this.
# Setting type: Single
# Default value: 2.2
ColossusReach = 2.2

## How far a Sovereign's swipe reaches, metres from its middle. It swipes at players within about 85% of this.
# Setting type: Single
# Default value: 3
SovereignReach = 3

## How long it draws its arm back before it swings, seconds. Step back now.
# Setting type: Single
# Default value: 0.5
WarnSeconds = 0.5

## Damage from a Stalker's swipe (players have 100).
# Setting type: Single
# Default value: 18
StalkerDamage = 18

## Damage from a Brute's swipe (players have 100).
# Setting type: Single
# Default value: 25
BruteDamage = 25

## Damage from a Colossus's swipe (players have 100).
# Setting type: Single
# Default value: 30
ColossusDamage = 30

## Damage from a Sovereign's swipe (players have 100).
# Setting type: Single
# Default value: 45
SovereignDamage = 45

## How long a Brute's or Colossus's swipe knocks you down, seconds. 0: no knockdown.
# Setting type: Single
# Default value: 1.5
TumbleSeconds = 1.5

## How far a Stalker pounces into its swipe, metres, in the last quarter second of the warning. 0: no pounce.
# Setting type: Single
# Default value: 1.2
StalkerPounce = 1.2

## Damage to another monster caught by a swipe. 0 leaves them alone.
# Setting type: Single
# Default value: 30
EnemyDamage = 30

## How hard a swipe shoves loot it catches, roughly m/s. Gentle: it knocks things about, it doesn't smash them.
# Setting type: Single
# Default value: 2
LootShove = 2

## The least time between swipes, seconds.
# Setting type: Single
# Default value: 1.2
Cooldown = 1.2

[Volley]

## It rears and shards gather in its hands, ringing, for this long before it flings them, seconds.
# Setting type: Single
# Default value: 0.8
WarnSeconds = 0.8

## The fewest shards in a volley.
# Setting type: Int32
# Default value: 5
MinShards = 5

## The most shards in a volley.
# Setting type: Int32
# Default value: 9
MaxShards = 9

## Half the width of the fan, degrees. At 10 m, 10 degrees is 1.8 m either side.
# Setting type: Single
# Default value: 10
Spread = 10

## Half the width of a Stalker's shake (its volley: it shakes shards off its back like a wet dog), degrees. Wider, so easier to get out of from far off but harder from close.
# Setting type: Single
# Default value: 22
StalkerShakeSpread = 22

## How fast the shards fly, m/s. Sprint sideways as they leave its hands and they miss.
# Setting type: Single
# Default value: 18
Speed = 18

## Damage from each shard that hits you.
# Setting type: Single
# Default value: 6
Damage = 6

## Damage to another monster from each shard. 0 leaves them alone.
# Setting type: Single
# Default value: 6
EnemyDamage = 6

## It only throws at players at least this far away, metres...
# Setting type: Single
# Default value: 4
MinRange = 4

## ...and no farther than this, metres, in plain sight.
# Setting type: Single
# Default value: 16
MaxRange = 16

## The least time between volleys, seconds.
# Setting type: Single
# Default value: 8
Cooldown = 8

