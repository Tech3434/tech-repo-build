## Settings file was created by plugin GeneratorMod v0.3.0
## Plugin GUID: KimJongPoon.GeneratorMod

[Debug]

## Log every shop roll and every recharge tick.
# Setting type: Boolean
# Default value: false
DebugLogging = false

[Recharge]

## Percent of a full truck energy bar restored per minute, per Generator level. Only ticks during active levels.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 100
RatePercentPerMinute = 3

## If true, only the host (or singleplayer) applies the recharge. Leave false unless clients double-count in multiplayer.
# Setting type: Boolean
# Default value: false
HostOnly = false

## Value of ChargingStation.chargeTotal that means a full bar. Vanilla is 100.
# Setting type: Int32
# Default value: 100
MaxCharge = 100

[Shop]

## Price of the Generator upgrade box in the shop (25000 = $25k).
# Setting type: Int32
# Default value: 25000
# Acceptable value range: From 1000 to 5000000
BasePrice = 1000

## Chance (in percent) that the Generator is added to the pool of upgrades for any one shop visit.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 100
ShopChancePercent = 10

## How many Generator levels the whole team can buy in total. Each level adds another RatePercentPerMinute.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 20
MaxPurchases = 1

## If false, the price is always exactly BasePrice. If true, the game's normal upgrade price scaling applies on top.
# Setting type: Boolean
# Default value: false
UseVanillaPriceScaling = false

## Name of the vanilla upgrade item whose prefab (the box) is copied. The stamina upgrade is 'Energy' in the game's code.
# Setting type: String
# Default value: Item Upgrade Player Energy
TemplateItemName = Item Upgrade Player Energy

