## Settings file was created by plugin MIMIC REPO v1.0.3
## Plugin GUID: repo.livingdouble

[Body]

## How many players it takes to lift the knocked-down mimic (1 to 4); one player can still drag it.
# Setting type: Int32
# Default value: 2
PlayersToLiftKnockedDown = 2

[Diagnostics]

## Log extra details.
# Setting type: Boolean
# Default value: false
Verbose = false

## Internal: settings migration marker. Do not change.
# Setting type: Int32
# Default value: 0
ConfigVersion = 2

[Encounter]

## Damage of a single blow; a lone victim can take two in one ambush.
# Setting type: Int32
# Default value: 35
Damage = 35

## Extra minimum peaceful time before an unprovoked reveal.
# Setting type: Int32
# Default value: 0
MinimumPeaceSeconds = 0

## Hit points (vanilla Hunter has 250). Standing it still dies to about eight hits; knocked down it takes full damage.
# Setting type: Int32
# Default value: 200
HitPoints = 200

## Auto, Easy, Medium or Hard: how often the mimic slips up. Auto: first level easy, second medium, from the third hard.
# Setting type: String
# Default value: Auto
HintDifficulty = Auto

## Some time after a player dies, an unseen mimic takes their look and voice (multiplayer).
# Setting type: Boolean
# Default value: true
CopyDeadPlayers = true

[Interface]

## Language of the F8 menu: Auto (system language) or English, Russian, Ukrainian, German, French, Spanish, Portuguese, Polish, Turkish.
# Setting type: String
# Default value: Auto
MenuLanguage = Auto

[Spawning]

## 1, 2 or 3. Game spawn tier; also sets the orb size dropped on death.
# Setting type: Int32
# Default value: 2
DifficultyTier = 2

## Let the game's enemy director pick the mimic like any other enemy.
# Setting type: Boolean
# Default value: false
NaturalSpawn = false

## Chance (0 to 1) per level to add one more mimic on top of the director's pick.
# Setting type: Single
# Default value: 1
ExtraSpawnChance = 1

## Upper limit for the extra spawn (0 to 3).
# Setting type: Int32
# Default value: 1
MaxPerLevel = 1

[Voice]

## Allow local capture and playback of mimic speech.
# Setting type: Boolean
# Default value: true
Enabled = true

## Replay local microphone phrases during solo levels.
# Setting type: Boolean
# Default value: true
RecordSoloMicrophone = true

## Preserve phrases across levels in the same run.
# Setting type: Boolean
# Default value: false
KeepUntilRunEnds = false

## Reply with a recorded phrase shortly after a nearby player stops talking.
# Setting type: Boolean
# Default value: true
AnswerWhenSpokenTo = true

## Repeat lines a player typed in text chat, in their TTS voice, when no recording is available.
# Setting type: Boolean
# Default value: true
UseChatLines = true

## Maximum phrases kept per player (30 to 60), short cut-out words included (up to 20).
# Setting type: Int32
# Default value: 60
PhraseBankLines = 60

